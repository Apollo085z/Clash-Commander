Nome: Build Clash Commander APK

sobre:
despacho de fluxo de trabalho:

permissões:
Conteúdo: leia

empregos:
construir:
executa em: ubuntu-latest
tempo limite em minutos: 60

passos:
- nome: Baixar projeto
utiliza: ações/checkout@v4

- nome: Instalar Java 17
utiliza: actions/setup-java@v4
com:
Distribuição: temurin
versão do java: '17'

- nome: Configurar SDK do Android
usa: android-actions/setup-android@v3

- nome: Instalar o SDK do Android 35
executar: sdkmanager "platforms;android-35" "build-tools;35.0.0"

- nome: Baixar modelos de fala de IA
executar: bash scripts/bootstrap_sherpa_deps.sh

- nome: Configurar chaves de API
ambiente:
GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
executar: |
printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> local.properties
printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> local.properties
printf 'ROBOFLOW_API_KEY=%s\n' "$ROBOFLOW_API_KEY" >> local.properties

- nome: Compilar APK
executar: |
chmod +x ./gradlew
./gradlew --no-daemon assembleDebug

- nome: Salvar APK
utiliza: actions/upload-artifact@v4
com:
nome: clash-commander-debug-apk
Caminho: app/build/outputs/apk/debug/app-debug.apk
se nenhum arquivo for encontrado: erro
dias de retenção: 7
